# ========== Nginx 反向代理配置 ==========
# 阶段二中间件引入 - Nginx反向代理配置
# 阶段三微服务拆分 - 新增 /api/* 路由到微服务，其他请求继续到旧 WAR

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Docker DNS 解析器（动态解析微服务地址）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript;

    # ========== 旧 WAR (Tomcat) ==========
    upstream tomcat_backend {
        server app:8080;
        keepalive 32;
    }

    # ========== 微服务变量定义（用于动态解析）==========
    # 使用变量让 Nginx 在请求时动态解析，而不是启动时

    # ========== HTTP 服务器 ==========
    server {
        listen 80;
        server_name localhost;

        # ========== 微服务 API 路由（阶段三新增，使用变量动态代理）==========

        # --- 文件服务 /api/files/* ---
        location /api/files/ {
            set $file_service file-service:8081;
            proxy_pass http://$file_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 100m;
        }

        # --- 用户服务 /api/users/* ---
        location /api/users/ {
            set $user_service user-service:8082;
            proxy_pass http://$user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- 活动服务 /api/activities/*, /api/attendance/*, /api/study/* ---
        location /api/activities/ {
            set $activity_service activity-service:8084;
            proxy_pass http://$activity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/attendance/ {
            set $activity_service activity-service:8084;
            proxy_pass http://$activity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/study/ {
            set $activity_service activity-service:8084;
            proxy_pass http://$activity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- 项目奖项服务 /api/projects/*, /api/awards/* ---
        location /api/projects/ {
            set $pa_service project-award-service:8085;
            proxy_pass http://$pa_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/awards/ {
            set $pa_service project-award-service:8085;
            proxy_pass http://$pa_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- HR 服务 /api/recruit/*, /api/resumes/* ---
        location /api/recruit/ {
            set $hr_service hr-service:8085;
            proxy_pass http://$hr_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/resumes/ {
            set $hr_service hr-service:8085;
            proxy_pass http://$hr_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- 监控服务 /api/problems/*, /api/logs/* ---
        location /api/problems/ {
            set $monitor_service monitor-service:8086;
            proxy_pass http://$monitor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/logs/ {
            set $monitor_service monitor-service:8086;
            proxy_pass http://$monitor_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- 内容服务 /api/groups/*, /api/news/* ---
        location /api/groups/ {
            set $content_service content-service:8087;
            proxy_pass http://$content_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/news/ {
            set $content_service content-service:8087;
            proxy_pass http://$content_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- AI 服务 /api/ai/* ---
        location /api/ai/ {
            set $ai_service ai-service:8094;
            proxy_pass http://$ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # --- 旧 WAR 兜底路由 ---
        location /api/ {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========== 旧 WAR 路由（保留原有功能）==========

        location / {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态资源
        location /localstorage/ {
            alias /usr/local/tomcat/webapps/localstorage/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /css/ {
            alias /usr/local/nginx/static/css/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /js/ {
            alias /usr/local/nginx/static/js/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /images/ {
            alias /usr/local/nginx/static/images/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            alias /usr/local/nginx/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location /ai {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /microservices/health {
            return 200 '{"status":"UP","services":["file-service","user-service","activity-service","project-award-service","hr-service","monitor-service","content-service","ai-service"]}\n';
            add_header Content-Type application/json;
        }
    }
}
