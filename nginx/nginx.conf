# ========== Nginx 反向代理配置 ==========
# 阶段二中间件引入 - Nginx反向代理配置

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript;

    # ========== upstream 后端服务 ==========
    upstream tomcat_backend {
        server app:8080;  # Docker 服务名
        # 预留多实例扩展
        # server app2:8080;
        # server app3:8080;
        keepalive 32;
    }

    # ========== HTTP 服务器 ==========
    server {
        listen 80;
        server_name localhost;

        # 根路径 - 反向代理到 Tomcat
        location / {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # HTTP 1.1 支持
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # 静态资源 - 从挂载的 volume 直接读取，不经过 Tomcat
        location /localstorage/ {
            alias /usr/local/tomcat/webapps/localstorage/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # 尝试查找文件
            try_files $uri $uri/ =404;
        }

        # ========== 静态资源直接服务（由 Nginx 处理，不经过 Tomcat）==========

        # CSS 样式表
        location /css/ {
            alias /usr/local/nginx/static/css/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # 尝试查找文件，文件不存在时返回404而不是重定向
            try_files $uri $uri/ =404;
        }

        # JavaScript 脚本
        location /js/ {
            alias /usr/local/nginx/static/js/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;

            try_files $uri $uri/ =404;
        }

        # 图片资源（含 avatar 子目录）
        location /images/ {
            alias /usr/local/nginx/static/images/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;

            try_files $uri $uri/ =404;
        }

        # 字体文件
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            alias /usr/local/nginx/static/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;

            try_files $uri =404;
        }

        # AI 服务（SSE 长连接，需要特殊处理）
        location /ai {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_http_version 1.1;

            # SSE 支持
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;

            # 长连接超时
            proxy_read_timeout 300s;
        }

        # API 接口
        location /api {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # API 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 健康检查
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
