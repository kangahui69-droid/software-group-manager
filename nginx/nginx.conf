# ========== Nginx 反向代理配置 ==========
# 阶段二中间件引入 - Nginx反向代理配置
# MIG-04: Keep API traffic on the legacy WAR until each microservice is verified.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    # Only the WAR-generated UUID may be used for cross-layer audit correlation.
    map $upstream_http_x_request_id $safe_audit_request_id {
        default "-";
        "~^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $upstream_http_x_request_id;
    }

    # Keep request targets, query strings, Referer, User-Agent and usernames out of access logs.
    log_format main '$remote_addr [$time_local] $request_method '
                    '$status $body_bytes_sent nginx_request_id=$request_id '
                    'audit_request_id=$safe_audit_request_id';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript;

    # ========== 旧 WAR (Tomcat) ==========
    upstream tomcat_backend {
        server app:8080;
        keepalive 32;
    }

    # All public requests use TLS. Keep port 80 only for redirects.
    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    # Certificate and key are supplied from a private host directory.
    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # MIG-04: Default to the legacy WAR until a domain passes contract and DB checks.
        # Existing JSP routes keep their /software-group context; /api/* uses the same WAR.
        location = /api {
            return 404;
        }

        # The legacy WAR has no /api/ai endpoint. Fail clearly instead of returning fake success.
        location = /api/ai {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            add_header X-SG-Route "disabled" always;
            return 503 '{"code":503,"message":"AI API is not enabled"}';
        }
        location ^~ /api/ai/ {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            add_header X-SG-Route "disabled" always;
            return 503 '{"code":503,"message":"AI API is not enabled"}';
        }

        # No equivalent member API exists in the legacy WAR.
        location = /api/members {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            add_header X-SG-Route "disabled" always;
            return 503 '{"code":503,"message":"Members API is not enabled"}';
        }
        location ^~ /api/members/ {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            add_header X-SG-Route "disabled" always;
            return 503 '{"code":503,"message":"Members API is not enabled"}';
        }

        location ^~ /api/ {
            proxy_pass http://tomcat_backend/software-group/api/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-SG-Route "legacy-war" always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Proxy-Client-IP '';
            proxy_set_header WL-Proxy-Client-IP '';
            proxy_set_header X-Client-IP '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-User-Id '';
            proxy_set_header X-Username '';
            proxy_set_header X-User-Role '';
            proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 100m;
        }
        # ========== 旧 WAR 路由（保留原有功能）==========
        # 旧 WAR 部署在 /software-group 上下文路径

        # 应用自身生成的链接带 /software-group 前缀（JSP 里的 ${contextPath}），此处原样透传
        location /software-group/ {
            client_max_body_size 55m;
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Proxy-Client-IP '';
            proxy_set_header WL-Proxy-Client-IP '';
            proxy_set_header X-Client-IP '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-User-Id '';
            proxy_set_header X-Username '';
            proxy_set_header X-User-Role '';
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 旧 WAR 兜底：根路径映射到 /software-group/（保证 / 与 /login.jsp 返回 200）
        location / {
            proxy_pass http://tomcat_backend/software-group/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Proxy-Client-IP '';
            proxy_set_header WL-Proxy-Client-IP '';
            proxy_set_header X-Client-IP '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-User-Id '';
            proxy_set_header X-Username '';
            proxy_set_header X-User-Role '';
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态资源
        location /localstorage/ {
            alias /usr/local/tomcat/webapps/localstorage/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /css/ {
            alias /usr/local/nginx/static/css/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /js/ {
            alias /usr/local/nginx/static/js/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location /images/ {
            alias /usr/local/nginx/static/images/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ =404;
        }

        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            alias /usr/local/nginx/static/;
            add_header Strict-Transport-Security "max-age=31536000" always;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location /ai {
            proxy_pass http://tomcat_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Forwarded '';
            proxy_set_header Proxy-Client-IP '';
            proxy_set_header WL-Proxy-Client-IP '';
            proxy_set_header X-Client-IP '';
            proxy_set_header X-Forwarded-Host '';
            proxy_set_header X-Forwarded-Port '';
            proxy_set_header X-User-Id '';
            proxy_set_header X-Username '';
            proxy_set_header X-User-Role '';
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # Container liveness only: this does not assert application readiness.
        location = /health {
            return 200 'OK';
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Content-Type text/plain;
        }

        # Readiness is available only to the container-local health probe.
        # It fails when the currently routed legacy WAR, MySQL or Redis is unavailable.
        location = /ready {
            allow 127.0.0.1;
            allow ::1;
            deny all;
            proxy_pass http://tomcat_backend/software-group/internal/ready;
            proxy_connect_timeout 2s;
            proxy_read_timeout 4s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
        }

        # Do not expose the WAR's internal probe on its public context path.
        location = /software-group/internal/ready {
            return 404;
        }

        location = /microservices/health {
            default_type application/json;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            add_header X-SG-Route "proxy-health" always;
            return 200 '{"proxy":"UP","apiRoute":"legacy-war","businessValidated":false}';
        }
    }
}
