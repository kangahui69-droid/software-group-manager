name: Compose network exposure

on:
  push:
    paths:
      - docker-compose.yml
      - scripts/check-compose-port-policy.py
      - .github/workflows/compose-network-policy.yml
  pull_request:
    paths:
      - docker-compose.yml
      - scripts/check-compose-port-policy.py
      - .github/workflows/compose-network-policy.yml

jobs:
  port-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject published internal ports
        run: python3 scripts/check-compose-port-policy.py
