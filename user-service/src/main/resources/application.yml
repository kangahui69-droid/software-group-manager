server:
  port: ${SERVER_PORT:8082}

spring:
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_FILE_SIZE:10MB}
      enabled: true

  # 数据库配置（user-service 专用 DB 用户）
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:software_group}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:kang2005.}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: user-service-pool

  # Redis 配置（用于JWT黑名单缓存）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 1
    timeout: 5000
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 2
        max-wait: -1ms

  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:software-group-jwt-secret-key-2024-very-long-and-secure}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # DES 加密配置（必须与旧系统一致）
  des:
    key: ${DES_KEY:(^&%gasie_%^}

# Spring Cloud Alibaba Nacos Discovery
alibaba:
  cloud:
    nacos:
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP

# Sentinel 熔断配置
spring.cloud.sentinel:
  enabled: true

# OpenFeign 配置
spring.cloud:
  openfeign:
    client:
      config:
        default:
          loggerLevel: basic
          connect-timeout: 5000
          read-timeout: 10000

# 日志配置
logging:
  level:
    root: INFO
    com.softwaregroup.user: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
