# 高校软件小组管理系统 - 配置文件模板
# 本文件为默认模板，提交到Git，不含真实密码
#
# 【本地开发使用说明】
# 1. 复制本文件为 config.local.properties
# 2. 在私有配置文件或环境变量中设置实际凭据
# 3. config.local.properties 已加入 .gitignore，不会被提交
# 4. 敏感环境变量优先于本地配置；本文件不提供密码默认值
#
# 【测试/生产环境】
# Docker Compose 使用私有 .env 注入运行期环境变量

# ============================================
# 数据库配置
# ============================================
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://${DB_HOST:-localhost}:${DB_PORT:-3306}/${DB_NAME:-software_group}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
db.username=${DB_USER:-root}
db.password=

# ============================================
# HikariCP 连接池配置
# ============================================
hikaricp.maximumPoolSize=10
hikaricp.minimumIdle=5
hikaricp.connectionTimeout=30000
hikaricp.idleTimeout=600000
hikaricp.maxLifetime=1800000
hikaricp.connectionTestQuery=SELECT 1
hikaricp.validationTimeout=5000

# ============================================
# 旧 DES 密码迁移配置：必须显式提供历史密钥，迁移完成后删除
# ============================================
des.key=

# ============================================
# 文件上传配置
# ============================================
upload.maxFileSize=10485760
upload.maxRequestSize=20971520
# 文件存储根目录（绝对路径，支持 ${user.dir} 代表项目根目录、${catalina.base} 代表Tomcat根目录）
# 该目录独立于webapp部署目录，重新部署/clean不会丢失上传文件
upload.baseDir=${user.dir}/localstorage

# ============================================
# 会话配置
# ============================================
session.timeout=30

# ============================================
# Redis 缓存配置（阶段二中间件引入）
# ============================================
redis.host=${REDIS_HOST:-localhost}
redis.port=${REDIS_PORT:-6379}
redis.password=
redis.database=0
# 缓存过期时间（秒）
redis.cache.ttl.default=3600
redis.cache.ttl.dictionary=86400
redis.cache.ttl.session=1800
redis.cache.ttl.statistics=300

# ============================================
# RabbitMQ 消息队列配置（阶段二中间件引入）
# ============================================
rabbitmq.host=${RABBITMQ_HOST:-localhost}
rabbitmq.port=${RABBITMQ_PORT:-5672}
rabbitmq.username=
rabbitmq.password=
rabbitmq.virtualHost=/

# ============================================
# AI服务配置
# ============================================
# AI服务提供商：minimax / volcengine / wenxin / qwen / openai
ai.provider=minimax
# API Key（请替换为你的实际API Key）
ai.api.key=your_api_key_here
# API Secret（文心一言等需要）
ai.api.secret=
# API URL
ai.api.url=https://api.minimaxi.com/v1/chat/completions
# 模型名称
ai.model=MiniMax-M2.7
# 超时时间（毫秒）
ai.timeout=60000
# 最大Token数
ai.max_tokens=2000
