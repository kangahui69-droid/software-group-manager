spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ai-service
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:-localhost}:8848
      username: nacos
      password: nacos
      discovery:
        namespace: ${NACOS_NAMESPACE:-public}
        group: DEFAULT_GROUP
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:software_group}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ai-service-pool

server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.softwaregroup.ai: DEBUG
