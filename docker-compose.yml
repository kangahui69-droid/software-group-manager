    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Prepare only the shared news directories for content-service's UID 1001.
  content-storage-init:
    image: software-group-content-service
    environment:
      TZ: Asia/Shanghai
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /storage/news/award /storage/news/activity /storage/news/notice &&
        chown 1001:1001 /storage/news /storage/news/award /storage/news/activity /storage/news/notice &&
        chmod 755 /storage/news /storage/news/award /storage/news/activity /storage/news/notice
    volumes:
      - app_data:/storage

  # --- content-service (8087) ---
  content-service:
    build:
      context: .
      dockerfile: ./content-service/Dockerfile
    image: software-group-content-service
    container_name: sg_content_service
    restart: always
    ports:
      - "127.0.0.1:${CONTENT_SERVICE_PORT:-8087}:8087"
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      NEWS_CONTENT_ROOT: /usr/local/tomcat/webapps/localstorage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    volumes:
      - app_data:/usr/local/tomcat/webapps/localstorage
    depends_on:
      content-storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8087/actuator/health"]
      interval: 15s
