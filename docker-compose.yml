    container_name: sg_user_service
    restart: always
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8082}:8082"
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      JWT_EXPIRATION_MS: 86400000
      # DES 加密密钥（必须与旧系统一致）
      DES_KEY: ${DES_KEY:?DES_KEY is required during legacy password migration}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: user-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

