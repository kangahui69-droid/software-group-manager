# ========== Docker Compose 配置 ==========
# 作用：定义和管理多容器应用的编排
# 使用方式：docker-compose up -d（后台启动所有服务）

# ========== 阶段三基础设施服务（Nacos、Sentinel、MinIO）==========
# 对应计划文档：阶段三_微服务拆分实施计划 - 3.1 基础设施搭建

services:

  # ========== MySQL 数据库服务 ==========
  mysql:
    # 使用官方 MySQL 8 镜像
    image: mysql:8

    # 容器名称（方便 docker ps 查看）
    container_name: sg_mysql

    # 容器退出后自动重启（生产环境推荐）
    restart: always

    # 环境变量（MySQL 镜像会自动使用这些配置初始化数据库）
    environment:
      TZ: Asia/Shanghai
      # root 密码（生产环境必须修改！）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # 自动创建的数据库名
      MYSQL_DATABASE: ${MYSQL_DATABASE:-software_group}
      # 字符集配置（必须 utf8mb4 支持中文）
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    command: ["--default-time-zone=+08:00"]

    # 数据卷挂载（持久化数据，容器删除后数据不丢失）
    volumes:
      # MySQL 数据目录（数据库文件存放位置）
      - mysql_data:/var/lib/mysql

    # Docker 网络（让容器之间可以互相通信）
    networks:
      - software-group-net

    # 健康检查（确保 MySQL 完全就绪后再启动 App）
    # 解决：App 启动太快，MySQL 还没准备好，导致连接失败
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s      # 每 10 秒检查一次
      timeout: 5s       # 5 秒超时
      retries: 5        # 连续失败 5 次认为不健康

  # Flyway owns business schema creation and upgrades. An existing database needs
  # an explicit, reviewed baseline before this service can succeed.
  db-migrate:
    image: maven:3.9-eclipse-temurin-17
    restart: "no"
    working_dir: /migrations
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-software_group}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      FLYWAY_USER: root
      FLYWAY_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - ./db-migrations:/migrations:ro
      - flyway_maven_cache:/root/.m2
    command: ["mvn", "-B", "-ntp", "-f", "/migrations/pom.xml", "flyway:migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - software-group-net

  # Root is used here only to provision runtime users after Flyway has created tables.
  db-users-init:
    image: mysql:8
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      DB03_BUSINESS_DB: ${MYSQL_DATABASE:-software_group}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      NACOS_DB_PASSWORD: ${NACOS_DB_PASSWORD:?NACOS_DB_PASSWORD is required}
      FILE_DB_PASSWORD: ${FILE_DB_PASSWORD:?FILE_DB_PASSWORD is required}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      PROJECT_AWARD_DB_PASSWORD: ${PROJECT_AWARD_DB_PASSWORD:?PROJECT_AWARD_DB_PASSWORD is required}
      HR_DB_PASSWORD: ${HR_DB_PASSWORD:?HR_DB_PASSWORD is required}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?MONITOR_DB_PASSWORD is required}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
    volumes:
      - ./scripts/provision-db-users.sh:/provision/provision-db-users.sh:ro
      - ./migrations/20261117_db03_runtime_grants.sql:/provision/runtime-grants.sql:ro
    entrypoint: ["sh", "/provision/provision-db-users.sh"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - software-group-net


  # ========== Redis 缓存服务（阶段二中间件引入）==========
  redis:
    # 使用 Alpine 精简版镜像（体积小、安全）
    image: redis:7-alpine

    # 容器名称
    container_name: sg_redis

    # 容器退出后自动重启
    restart: always

    # 数据卷挂载（持久化 Redis 数据）
    volumes:
      - redis_data:/data

    # Docker 网络
    networks:
      - software-group-net

    # Redis 配置；避免在 Compose 命令中展开密码
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== RabbitMQ 消息队列服务（阶段二中间件引入）==========
  rabbitmq:
    # 使用带 management 插件的 Alpine 镜像（体积小、带管理界面）
    image: rabbitmq:3-management-alpine

    # 容器名称
    container_name: sg_rabbitmq

    # 容器退出后自动重启
    restart: always

    # 环境变量（设置默认用户和密码）
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    # 数据卷挂载（持久化 RabbitMQ 数据和配置）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Nacos 服务注册中心（阶段三基础设施）==========
  # 用于微服务注册与发现，不使用配置中心（延用本地 application.yml）
  # 开发环境使用嵌入式 Derby 数据库，生产环境可切换为 MySQL
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: sg_nacos
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 单机模式（使用嵌入式 Derby 数据库，无需 MySQL）
      MODE: standalone
      # Nacos 2.2.3 authentication; provision the client account before cutover.
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?NACOS_AUTH_TOKEN is required}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?NACOS_AUTH_IDENTITY_KEY is required}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?NACOS_AUTH_IDENTITY_VALUE is required}
      # JVM 内存配置（单机模式降低资源占用）
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      # 持久化改用 MySQL：内嵌 Derby 在慢盘（Hyper-V 动态扩展 VHDX）上启动会超过其 30s 登录超时，
      # 建库失败进入崩溃循环，且调大超时参数无效（2026-10-02 实测）
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: sg_nacos_svc
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?NACOS_DB_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=3000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== Sentinel 熔断器 Dashboard（阶段三基础设施）==========
  # 用于服务容错和流量控制
  sentinel:
    image: bladex/sentinel-dashboard:latest
    container_name: sg_sentinel
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # JVM 内存配置
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8858/"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ========== MinIO 对象存储服务（阶段三基础设施）==========
  # 替代本地文件系统共享问题，支持 S3 协议
  minio:
    image: minio/minio:latest
    container_name: sg_minio
    restart: always
    environment:
      TZ: Asia/Shanghai
      # Root 用户凭证（生产环境必须修改！）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/data
    networks:
      - software-group-net
    # MinIO 服务命令
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 微服务（阶段三新增）==========
  # 对应计划文档：阶段三_微服务拆分实施计划 - 3.3~3.8

  # --- file-service (8081) ---
  file-service:
    build:
      context: .
      dockerfile: ./file-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_file_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_file_svc
      DB_PASSWORD: ${FILE_DB_PASSWORD:?FILE_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # MinIO 配置
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: software-group
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: file-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- user-service (8082) ---
  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_user_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_user_svc
      DB_PASSWORD: ${USER_DB_PASSWORD:?USER_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      JWT_EXPIRATION_MS: 86400000
      # DES 加密密钥（必须与旧系统一致）
      DES_KEY: ${DES_KEY:?DES_KEY is required during legacy password migration}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: user-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- activity-service (8084) ---
  activity-service:
    build:
      context: .
      dockerfile: ./activity-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_activity_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_activity_svc
      DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:?ACTIVITY_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: activity-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- project-award-service (8085) ---
  project-award-service:
    build:
      context: .
      dockerfile: ./project-award-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_project_award_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_project_award_svc
      DB_PASSWORD: ${PROJECT_AWARD_DB_PASSWORD:?PROJECT_AWARD_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- hr-service (8089) ---
  hr-service:
    build:
      context: .
      dockerfile: ./hr-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_hr_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_hr_svc
      DB_PASSWORD: ${HR_DB_PASSWORD:?HR_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: hr-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8089/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- monitor-service (8086) ---
  monitor-service:
    build:
      context: .
      dockerfile: ./monitor-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_monitor_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_monitor_svc
      DB_PASSWORD: ${MONITOR_DB_PASSWORD:?MONITOR_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: monitor-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Prepare only the shared news directories for content-service's UID 1001.
  content-storage-init:
    image: software-group-content-service
    environment:
      TZ: Asia/Shanghai
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /storage/news/award /storage/news/activity /storage/news/notice &&
        chown 1001:1001 /storage/news /storage/news/award /storage/news/activity /storage/news/notice &&
        chmod 755 /storage/news /storage/news/award /storage/news/activity /storage/news/notice
    volumes:
      - app_data:/storage

  # --- content-service (8087) ---
  content-service:
    build:
      context: .
      dockerfile: ./content-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    image: software-group-content-service
    container_name: sg_content_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      NEWS_CONTENT_ROOT: /usr/local/tomcat/webapps/localstorage
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_content_svc
      DB_PASSWORD: ${CONTENT_DB_PASSWORD:?CONTENT_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    volumes:
      - app_data:/usr/local/tomcat/webapps/localstorage
    depends_on:
      content-storage-init:
        condition: service_completed_successfully
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- ai-service (8094) ---
  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}
    container_name: sg_ai_service
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: sg_ai_svc
      DB_PASSWORD: ${AI_DB_PASSWORD:?AI_DB_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # AI 服务配置
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required for AI services}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}
      # RabbitMQ 配置
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: ${NACOS_USERNAME:?NACOS_USERNAME is required}
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: ${NACOS_PASSWORD:?NACOS_PASSWORD is required}
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8094/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 应用服务（Tomcat + WAR）- 旧 WAR 保留 ==========
  app:
    # 单实例 Tomcat 管理本地 HttpSession；当前不支持跨实例会话共享。
    # 从 Dockerfile 构建镜像
    # context: 构建上下文（. 表示当前目录）
    # dockerfile: Dockerfile 文件名
    build:
      context: .
      dockerfile: Dockerfile.tomcat
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unrecorded}

    container_name: sg_app
    restart: always

    # 启动依赖：确保 MySQL、Redis 和 RabbitMQ 健康检查通过后再启动 App
    depends_on:
      db-users-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    # 运行期环境变量由 config.Config 读取；敏感值必须在私有 .env 或外部环境中提供
    environment:
      TZ: Asia/Shanghai
      # 仅信任同一 Compose 网络中的 Nginx 服务地址；直连 8080 忽略转发头
      AUDIT_TRUSTED_PROXY_HOSTS: nginx
      APP_ENV: production
      # 旧 WAR 使用独立的业务数据账号
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-software_group}
      DB_USER: sg_app_svc
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      # 连接池 / 加密 / 上传目录；会话超时由 web.xml 的 30 分钟配置控制。
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-5}
      DES_KEY: ${DES_KEY:?DES_KEY is required during legacy password migration}
      UPLOAD_BASE_DIR: /usr/local/tomcat/webapps/localstorage
      NEWS_MEDIA_DIR: /var/lib/software-group/news-media
      # Redis 用于业务缓存及就绪检查；HttpSession 不写入 Redis。
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # AI 服务
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required for AI services}
      AI_API_SECRET: ${AI_API_SECRET:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}

    # 数据卷挂载（文件上传目录持久化）
    # 解决：容器内文件上传后，删除容器文件丢失的问题
    volumes:
      - app_data:/usr/local/tomcat/webapps/localstorage
      - news_media_data:/var/lib/software-group/news-media

    networks:
      - software-group-net

  # ========== Nginx 反向代理服务（阶段二中间件引入）==========
  # 可选内部监控；不发布宿主端口，也不参与默认业务启动。
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: sg_prometheus
    profiles:
      - monitoring
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - software-group-net

  # ========== Nginx 反向代理服务（阶段二中间件引入）==========
  nginx:
    # 使用 Alpine 精简版镜像
    image: nginx:alpine

    environment:
      TZ: Asia/Shanghai

    # 容器名称
    container_name: sg_nginx

    # 容器退出后自动重启
    restart: always

    # 唯一对外发布的服务：80 仅重定向到 HTTPS，业务由 443 提供。
    ports:
      - "80:80"
      - "443:443"

    # 配置和数据卷挂载
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 证书必须在私有宿主目录中准备好，禁止将私钥提交到仓库。
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to an absolute private certificate directory}:/etc/nginx/tls:ro
      # 用户上传文件（从 app 的 volume 挂载）
      - app_data:/usr/local/tomcat/webapps/localstorage:ro
      # 静态资源目录（CSS/JS/Images 独立挂载到 static 目录）
      - ./static/css:/usr/local/nginx/static/css:ro
      - ./static/js:/usr/local/nginx/static/js:ro
      - ./static/images:/usr/local/nginx/static/images:ro

    # 依赖微服务和 app 服务
    depends_on:
      - app
      - file-service
      - user-service
      - activity-service
      - project-award-service
      - hr-service
      - monitor-service
      - content-service
      - ai-service

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "--spider", "https://127.0.0.1/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

# ========== 网络定义 ==========
# 网络类型 bridge（桥接网络）：
# - 容器之间可以互相通信
# - 隔离外部网络
# - 服务名（如 mysql）会自动 DNS 解析为容器 IP
networks:
  software-group-net:
    driver: bridge

# ========== 数据卷定义 ==========
# Docker 管理的命名数据卷：
# - 容器删除后数据卷中的数据仍然保留
# - Docker 自动处理权限问题
# - 适合 Windows/Linux/macOS 跨平台
volumes:
  flyway_maven_cache:
  mysql_data:
  redis_data:
  rabbitmq_data:
  app_data:
  news_media_data:
  # 阶段三新增数据卷
  nacos_data:     # Nacos 数据持久化
  nacos_logs:     # Nacos 日志持久化
  minio_data:     # MinIO 数据持久化
  prometheus_data:
