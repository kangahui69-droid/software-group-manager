# ========== Docker Compose 配置 ==========
# 作用：定义和管理多容器应用的编排
# 使用方式：docker-compose up -d（后台启动所有服务）

# ========== 阶段三基础设施服务（Nacos、Sentinel、MinIO）==========
# 对应计划文档：阶段三_微服务拆分实施计划 - 3.1 基础设施搭建

services:

  # ========== MySQL 数据库服务 ==========
  mysql:
    # 使用官方 MySQL 8 镜像
    image: mysql:8

    # 容器名称（方便 docker ps 查看）
    container_name: sg_mysql

    # 容器退出后自动重启（生产环境推荐）
    restart: always

    # 环境变量（MySQL 镜像会自动使用这些配置初始化数据库）
    environment:
      TZ: Asia/Shanghai
      # root 密码（生产环境必须修改！）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # 自动创建的数据库名
      MYSQL_DATABASE: ${MYSQL_DATABASE:-software_group}
      # 字符集配置（必须 utf8mb4 支持中文）
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    command: ["--default-time-zone=+08:00"]

    # 端口映射：宿主机端口:容器端口
    # 访问方式：宿主机上连接 localhost:3306 就等于连接容器内的 MySQL
    ports:
      - "${MYSQL_PORT:-3307}:3306"

    # 数据卷挂载（持久化数据，容器删除后数据不丢失）
    volumes:
      # MySQL 数据目录（数据库文件存放位置）
      - mysql_data:/var/lib/mysql
      # 初始化 SQL 脚本（容器首次启动时自动执行）
      # :ro 表示只读权限
      - ./sql:/docker-entrypoint-initdb.d:ro

    # Docker 网络（让容器之间可以互相通信）
    networks:
      - software-group-net

    # 健康检查（确保 MySQL 完全就绪后再启动 App）
    # 解决：App 启动太快，MySQL 还没准备好，导致连接失败
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s      # 每 10 秒检查一次
      timeout: 5s       # 5 秒超时
      retries: 5        # 连续失败 5 次认为不健康


  # ========== Redis 缓存服务（阶段二中间件引入）==========
  redis:
    # 使用 Alpine 精简版镜像（体积小、安全）
    image: redis:7-alpine

    # 容器名称
    container_name: sg_redis

    # 容器退出后自动重启
    restart: always

    # 端口映射：宿主机访问 localhost:6379 = 容器内 6379
    ports:
      - "${REDIS_PORT:-6379}:6379"

    # 数据卷挂载（持久化 Redis 数据）
    volumes:
      - redis_data:/data

    # Docker 网络
    networks:
      - software-group-net

    # Redis 配置；避免在 Compose 命令中展开密码
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== RabbitMQ 消息队列服务（阶段二中间件引入）==========
  rabbitmq:
    # 使用带 management 插件的 Alpine 镜像（体积小、带管理界面）
    image: rabbitmq:3-management-alpine

    # 容器名称
    container_name: sg_rabbitmq

    # 容器退出后自动重启
    restart: always

    # 端口映射
    # 5672: AMQP 协议端口（应用连接）
    # 15672: 管理界面端口（浏览器访问）
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGE_PORT:-15672}:15672"

    # 环境变量（设置默认用户和密码）
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    # 数据卷挂载（持久化 RabbitMQ 数据和配置）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Nacos 服务注册中心（阶段三基础设施）==========
  # 用于微服务注册与发现，不使用配置中心（延用本地 application.yml）
  # 开发环境使用嵌入式 Derby 数据库，生产环境可切换为 MySQL
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: sg_nacos
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 单机模式（使用嵌入式 Derby 数据库，无需 MySQL）
      MODE: standalone
      # Nacos 认证（开发环境关闭，生产环境必须开启）
      NACOS_AUTH_ENABLE: false
      # JVM 内存配置（单机模式降低资源占用）
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      # 持久化改用 MySQL：内嵌 Derby 在慢盘（Hyper-V 动态扩展 VHDX）上启动会超过其 30s 登录超时，
      # 建库失败进入崩溃循环，且调大超时参数无效（2026-10-02 实测）
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=3000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== Sentinel 熔断器 Dashboard（阶段三基础设施）==========
  # 用于服务容错和流量控制
  sentinel:
    image: bladex/sentinel-dashboard:latest
    container_name: sg_sentinel
    restart: always
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # JVM 内存配置
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8858/"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ========== MinIO 对象存储服务（阶段三基础设施）==========
  # 替代本地文件系统共享问题，支持 S3 协议
  minio:
    image: minio/minio:latest
    container_name: sg_minio
    restart: always
    environment:
      TZ: Asia/Shanghai
      # Root 用户凭证（生产环境必须修改！）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      # API 端口
      - "${MINIO_PORT:-9000}:9000"
      # Console 管理界面端口
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - software-group-net
    # MinIO 服务命令
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 微服务（阶段三新增）==========
  # 对应计划文档：阶段三_微服务拆分实施计划 - 3.3~3.8

  # --- file-service (8081) ---
  file-service:
    build:
      context: .
      dockerfile: ./file-service/Dockerfile
    container_name: sg_file_service
    restart: always
    ports:
      - "127.0.0.1:${FILE_SERVICE_PORT:-8081}:8081"
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_KEY_ID: ${JWT_KEY_ID:-v1}
      # MinIO 配置
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: software-group
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_APPLICATION_NAME: file-service
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- user-service (8082) ---
  user-service:
