      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # AI 服务配置
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required for AI services}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}
      # RabbitMQ 配置
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # Nacos 配置
      NACOS_HOST: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8094/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 应用服务（Tomcat + WAR）- 旧 WAR 保留 ==========
  app:
    # 从 Dockerfile 构建镜像
    # context: 构建上下文（. 表示当前目录）
    # dockerfile: Dockerfile 文件名
    build:
      context: .
      dockerfile: Dockerfile.tomcat

    container_name: sg_app
    restart: always

    # 端口映射：宿主机访问 localhost:8080 = 容器内 8080
    ports:
      - "${APP_PORT:-8080}:8080"

    # 启动依赖：确保 MySQL、Redis 和 RabbitMQ 健康检查通过后再启动 App
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    # 运行期环境变量由 config.Config 读取；敏感值必须在私有 .env 或外部环境中提供
    environment:
      TZ: Asia/Shanghai
      # 仅信任同一 Compose 网络中的 Nginx 服务地址；直连 8080 忽略转发头
      AUDIT_TRUSTED_PROXY_HOSTS: nginx
      APP_ENV: production
      # 数据库（用户名 root，密码与 mysql 服务的 MYSQL_ROOT_PASSWORD 同源）
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-software_group}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      # 连接池 / 会话 / 加密 / 上传目录
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-5}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30}
      DES_KEY: ${DES_KEY:?DES_KEY is required during legacy password migration}
      UPLOAD_BASE_DIR: /usr/local/tomcat/webapps/localstorage
      # Redis（SessionRedisFilter 挂在 /* 上，密码错了所有页面都过不去）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      # AI 服务
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY is required for AI services}
      AI_API_SECRET: ${AI_API_SECRET:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}

    # 数据卷挂载（文件上传目录持久化）
    # 解决：容器内文件上传后，删除容器文件丢失的问题
    volumes:
      - app_data:/usr/local/tomcat/webapps/localstorage

    networks:
      - software-group-net

  # ========== Nginx 反向代理服务（阶段二中间件引入）==========
  nginx:
    # 使用 Alpine 精简版镜像
    image: nginx:alpine

    environment:
      TZ: Asia/Shanghai

    # 容器名称
    container_name: sg_nginx

    # 容器退出后自动重启
    restart: always

    # 端口映射：宿主机访问 localhost:80 = 容器内 80
    ports:
      - "${NGINX_PORT:-80}:80"

    # 配置和数据卷挂载
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 用户上传文件（从 app 的 volume 挂载）
      - app_data:/usr/local/tomcat/webapps/localstorage:ro
      # 静态资源目录（CSS/JS/Images 独立挂载到 static 目录）
      - ./static/css:/usr/local/nginx/static/css:ro
      - ./static/js:/usr/local/nginx/static/js:ro
      - ./static/images:/usr/local/nginx/static/images:ro

    # 依赖微服务和 app 服务
    depends_on:
      - app
      - file-service
      - user-service
      - activity-service
      - project-award-service
      - hr-service
      - monitor-service
      - content-service
      - ai-service

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ========== 网络定义 ==========
# 网络类型 bridge（桥接网络）：
# - 容器之间可以互相通信
# - 隔离外部网络
# - 服务名（如 mysql）会自动 DNS 解析为容器 IP
networks:
  software-group-net:
    driver: bridge

# ========== 数据卷定义 ==========
# Docker 管理的命名数据卷：
# - 容器删除后数据卷中的数据仍然保留
# - Docker 自动处理权限问题
# - 适合 Windows/Linux/macOS 跨平台
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  app_data:
  # 阶段三新增数据卷
  nacos_data:     # Nacos 数据持久化
  nacos_logs:     # Nacos 日志持久化
  minio_data:     # MinIO 数据持久化
