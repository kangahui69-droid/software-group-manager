# ========== Docker Compose 配置 ==========
# 作用：定义和管理多容器应用的编排
# 使用方式：docker-compose up -d（后台启动所有服务）

# ========== 阶段三基础设施服务（Nacos、Sentinel、MinIO）==========
# 对应计划文档：阶段三_微服务拆分实施计划 - 3.1 基础设施搭建

services:

  # ========== MySQL 数据库服务 ==========
  mysql:
    # 使用官方 MySQL 8 镜像
    image: mysql:8

    # 容器名称（方便 docker ps 查看）
    container_name: sg_mysql

    # 容器退出后自动重启（生产环境推荐）
    restart: always

    # 环境变量（MySQL 镜像会自动使用这些配置初始化数据库）
    environment:
      # root 密码（生产环境必须修改！）
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # 自动创建的数据库名
      MYSQL_DATABASE: ${MYSQL_DATABASE:-software_group}
      # 字符集配置（必须 utf8mb4 支持中文）
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci

    # 端口映射：宿主机端口:容器端口
    # 访问方式：宿主机上连接 localhost:3306 就等于连接容器内的 MySQL
    ports:
      - "${MYSQL_PORT:-3307}:3306"

    # 数据卷挂载（持久化数据，容器删除后数据不丢失）
    volumes:
      # MySQL 数据目录（数据库文件存放位置）
      - mysql_data:/var/lib/mysql
      # 初始化 SQL 脚本（容器首次启动时自动执行）
      # :ro 表示只读权限
      - ./sql:/docker-entrypoint-initdb.d:ro

    # Docker 网络（让容器之间可以互相通信）
    networks:
      - software-group-net

    # 健康检查（确保 MySQL 完全就绪后再启动 App）
    # 解决：App 启动太快，MySQL 还没准备好，导致连接失败
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s      # 每 10 秒检查一次
      timeout: 5s       # 5 秒超时
      retries: 5        # 连续失败 5 次认为不健康


  # ========== Redis 缓存服务（阶段二中间件引入）==========
  redis:
    # 使用 Alpine 精简版镜像（体积小、安全）
    image: redis:7-alpine

    # 容器名称
    container_name: sg_redis

    # 容器退出后自动重启
    restart: always

    # 端口映射：宿主机访问 localhost:6379 = 容器内 6379
    ports:
      - "${REDIS_PORT:-6379}:6379"

    # 数据卷挂载（持久化 Redis 数据）
    volumes:
      - redis_data:/data

    # Docker 网络
    networks:
      - software-group-net

    # Redis 配置
    # appendonly yes: 开启 AOF 持久化，数据更安全
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}

    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== RabbitMQ 消息队列服务（阶段二中间件引入）==========
  rabbitmq:
    # 使用带 management 插件的 Alpine 镜像（体积小、带管理界面）
    image: rabbitmq:3-management-alpine

    # 容器名称
    container_name: sg_rabbitmq

    # 容器退出后自动重启
    restart: always

    # 端口映射
    # 5672: AMQP 协议端口（应用连接）
    # 15672: 管理界面端口（浏览器访问）
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGE_PORT:-15672}:15672"

    # 环境变量（设置默认用户和密码）
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}

    # 数据卷挂载（持久化 RabbitMQ 数据和配置）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Nacos 服务注册中心（阶段三基础设施）==========
  # 用于微服务注册与发现，不使用配置中心（延用本地 application.yml）
  # 开发环境使用嵌入式 Derby 数据库，生产环境可切换为 MySQL
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: sg_nacos
    restart: always
    environment:
      # 单机模式（使用嵌入式 Derby 数据库，无需 MySQL）
      MODE: standalone
      # Nacos 认证（开发环境关闭，生产环境必须开启）
      NACOS_AUTH_ENABLE: false
      # JVM 内存配置（单机模式降低资源占用）
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== Sentinel 熔断器 Dashboard（阶段三基础设施）==========
  # 用于服务容错和流量控制
  sentinel:
    image: bladex/sentinel-dashboard:latest
    container_name: sg_sentinel
    restart: always
    environment:
      # JVM 内存配置
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "${SENTINEL_PORT:-8858}:8858"
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8858/"]
      interval: 15s
      timeout: 10s
      retries: 3

  # ========== MinIO 对象存储服务（阶段三基础设施）==========
  # 替代本地文件系统共享问题，支持 S3 协议
  minio:
    image: minio/minio:latest
    container_name: sg_minio
    restart: always
    environment:
      # Root 用户凭证（生产环境必须修改！）
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      # API 端口
      - "${MINIO_PORT:-9000}:9000"
      # Console 管理界面端口
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - software-group-net
    # MinIO 服务命令
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 微服务（阶段三新增）==========
  # 对应计划文档：阶段三_微服务拆分实施计划 - 3.3~3.8

  # --- file-service (8081) ---
  file-service:
    build:
      context: .
      dockerfile: ./file-service/Dockerfile
    container_name: sg_file_service
    restart: always
    ports:
      - "${FILE_SERVICE_PORT:-8081}:8081"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # MinIO 配置
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: software-group
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- user-service (8082) ---
  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: sg_user_service
    restart: always
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-software-group-jwt-secret-key-2024-very-long-and-secure}
      JWT_EXPIRATION_MS: 86400000
      # DES 加密密钥（必须与旧系统一致）
      DES_KEY: ${DES_KEY:-(^&%gasie_%^)}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- activity-service (8084) ---
  activity-service:
    build:
      context: .
      dockerfile: ./activity-service/Dockerfile
    container_name: sg_activity_service
    restart: always
    ports:
      - "${ACTIVITY_SERVICE_PORT:-8084}:8084"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- project-award-service (8085) ---
  project-award-service:
    build:
      context: .
      dockerfile: ./project-award-service/Dockerfile
    container_name: sg_project_award_service
    restart: always
    ports:
      - "${PROJECT_AWARD_SERVICE_PORT:-8085}:8085"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- hr-service (8089 外部端口) ---
  hr-service:
    build:
      context: .
      dockerfile: ./hr-service/Dockerfile
    container_name: sg_hr_service
    restart: always
    ports:
      - "${HR_SERVICE_PORT:-8089}:8085"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- monitor-service (8086) ---
  monitor-service:
    build:
      context: .
      dockerfile: ./monitor-service/Dockerfile
    container_name: sg_monitor_service
    restart: always
    ports:
      - "${MONITOR_SERVICE_PORT:-8086}:8086"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- content-service (8087) ---
  content-service:
    build:
      context: .
      dockerfile: ./content-service/Dockerfile
    container_name: sg_content_service
    restart: always
    ports:
      - "${CONTENT_SERVICE_PORT:-8087}:8087"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- ai-service (8094) ---
  ai-service:
    build:
      context: .
      dockerfile: ./ai-service/Dockerfile
    container_name: sg_ai_service
    restart: always
    ports:
      - "${AI_SERVICE_PORT:-8094}:8094"
    environment:
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: software_group
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # AI 服务配置
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}
      # RabbitMQ 配置
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      # Nacos 配置
      NACOS_HOST: nacos
      NACOS_PORT: 8848
      NACOS_NAMESPACE: public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks:
      - software-group-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ========== 应用服务（Tomcat + WAR）- 旧 WAR 保留 ==========
  app:
    # 从 Dockerfile 构建镜像
    # context: 构建上下文（. 表示当前目录）
    # dockerfile: Dockerfile 文件名
    build:
      context: .
      dockerfile: Dockerfile.tomcat
      # 构建时参数（传递给 Dockerfile，用于 envsubst 替换）
      args:
        DB_HOST: mysql
        DB_PORT: "3306"
        DB_NAME: ${MYSQL_DATABASE:-software_group}
        DB_USER: root
        DB_PASSWORD: ${MYSQL_PASSWORD:-root123}
        AI_PROVIDER: ${AI_PROVIDER:-minimax}
        AI_API_KEY: ${AI_API_KEY:-}
        AI_API_URL: ${AI_API_URL:-}
        AI_MODEL: ${AI_MODEL:-MiniMax-M2.7}
        DES_KEY: ${DES_KEY:-(^&%gasie_%^)}
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
        RABBITMQ_HOST: rabbitmq
        RABBITMQ_PORT: "5672"
        RABBITMQ_USER: ${RABBITMQ_USER:-admin}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
        HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
        HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-5}
        SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30}
        UPLOAD_BASE_DIR: /usr/local/tomcat/webapps/localstorage

    container_name: sg_app
    restart: always

    # 端口映射：宿主机访问 localhost:8080 = 容器内 8080
    ports:
      - "${APP_PORT:-8080}:8080"

    # 启动依赖：确保 MySQL、Redis 和 RabbitMQ 健康检查通过后再启动 App
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    # 环境变量（运行时注入，但 config.local.properties 已在构建时替换）
    environment:
      # AI 服务配置（运行时可能需要）
      AI_PROVIDER: ${AI_PROVIDER:-minimax}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-}

    # 数据卷挂载（文件上传目录持久化）
    # 解决：容器内文件上传后，删除容器文件丢失的问题
    volumes:
      - app_data:/usr/local/tomcat/webapps/localstorage

    networks:
      - software-group-net

  # ========== Nginx 反向代理服务（阶段二中间件引入）==========
  nginx:
    # 使用 Alpine 精简版镜像
    image: nginx:alpine

    # 容器名称
    container_name: sg_nginx

    # 容器退出后自动重启
    restart: always

    # 端口映射：宿主机访问 localhost:80 = 容器内 80
    ports:
      - "${NGINX_PORT:-80}:80"

    # 配置和数据卷挂载
    volumes:
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 用户上传文件（从 app 的 volume 挂载）
      - app_data:/usr/local/tomcat/webapps/localstorage:ro
      # 静态资源目录（CSS/JS/Images 独立挂载到 static 目录）
      - ./static/css:/usr/local/nginx/static/css:ro
      - ./static/js:/usr/local/nginx/static/js:ro
      - ./static/images:/usr/local/nginx/static/images:ro

    # 依赖微服务和 app 服务
    depends_on:
      - app
      - file-service
      - user-service
      - activity-service
      - project-award-service
      - hr-service
      - monitor-service
      - content-service
      - ai-service

    # Docker 网络
    networks:
      - software-group-net

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ========== 网络定义 ==========
# 网络类型 bridge（桥接网络）：
# - 容器之间可以互相通信
# - 隔离外部网络
# - 服务名（如 mysql）会自动 DNS 解析为容器 IP
networks:
  software-group-net:
    driver: bridge

# ========== 数据卷定义 ==========
# Docker 管理的命名数据卷：
# - 容器删除后数据卷中的数据仍然保留
# - Docker 自动处理权限问题
# - 适合 Windows/Linux/macOS 跨平台
volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  app_data:
  # 阶段三新增数据卷
  nacos_data:     # Nacos 数据持久化
  nacos_logs:     # Nacos 日志持久化
  minio_data:     # MinIO 数据持久化
