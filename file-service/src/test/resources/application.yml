server:
  port: 8081

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  # MinIO 测试配置
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: software-group-test

  # H2 内存数据库（测试用）
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # Redis 测试配置
  redis:
    host: localhost
    port: 6379

  cloud:
    nacos:
      discovery:
        enabled: false

# 禁用 Sentinel
alibaba:
  cloud:
    sentinel:
      enabled: false

logging:
  level:
    root: WARN
    com.softwaregroup.file: DEBUG
