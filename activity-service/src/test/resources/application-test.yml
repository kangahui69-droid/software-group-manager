spring:
  profiles:
    active: test

  # H2 内存数据库（测试用）
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 数据库初始化
  sql:
    init:
      mode: never

  # Redis Mock（测试时禁用）
  data:
    redis:
      repositories:
        enabled: false

  # JWT 测试配置
  jwt:
    secret: test-jwt-secret-key-for-activity-service-testing-only-very-long
    expiration-ms: 86400000

# 禁用 Spring Cloud（测试时不连接 Nacos）
spring.cloud:
  nacos:
    discovery:
      enabled: false
    config:
      enabled: false
  sentinel:
    enabled: false

# OpenFeign Mock（测试时不实际调用其他服务）
spring.cloud.openfeign:
  client:
    config:
      default:
        connect-timeout: 1000
        read-timeout: 1000

# 禁用 Sentinel
alibaba:
  cloud:
    sentinel:
      enabled: false

logging:
  level:
    root: WARN
    com.softwaregroup.activity: DEBUG
